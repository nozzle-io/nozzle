name: CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Preserve the asset-upload / latest-tag publication sequence on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' && github.event_name != 'release' }}

jobs:
  check-no-exceptions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check exception policy
        run: bash scripts/check_no_exceptions.sh .

  check-source-manifest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check source lists
        run: bash scripts/check_source_manifest.sh
      - name: Check binding enum manifest against C compiler
        run: |
          python3 scripts/test_enum_manifest.py
          python3 scripts/generate_enum_manifest.py --check --assertions "$RUNNER_TEMP/nozzle_enum_assertions.c"
          cc -std=c11 -fsyntax-only -Iinclude "$RUNNER_TEMP/nozzle_enum_assertions.c"

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DNOZZLE_ENABLE_TEST_HOOKS=ON

      - name: Build
        id: build
        run: cmake --build build

      - name: Shared layout unit regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: ./build/tests/nozzle_tests "[shared_layout]" --reporter console --success

      - name: Shared layout receiver regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: ./build/tests/nozzle_integration_tests "[shared_layout]" --reporter console --success

      - name: Initial metadata regression (actual Metal device)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          ./build/tests/nozzle_integration_tests "[initial_metadata]" --reporter console --success | tee initial-metadata.log
          if grep -qi "skipped" initial-metadata.log; then
            echo "::error::[initial_metadata] must run on the actual Metal backend"
            exit 1
          fi

      - name: Sender lifecycle regression (actual Metal device)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          ./build/tests/nozzle_integration_tests "[sender_lifecycle]" --reporter console --success | tee sender-lifecycle.log
          if grep -qi "skipped" sender-lifecycle.log; then
            echo "::error::[sender_lifecycle] must run on the actual Metal backend"
            exit 1
          fi

      - name: Unit tests
        run: ./build/tests/nozzle_tests --reporter compact

      - name: C API tests
        run: ./build/tests/nozzle_c_api_tests --reporter compact

      # Integration tests must SKIP unsupported runner capabilities, not hide failures.
      - name: Integration tests
        run: ./build/tests/nozzle_integration_tests --reporter compact

      - name: Writable-frame integration tests must run
        shell: bash
        run: |
          set -o pipefail
          ./build/tests/nozzle_integration_tests "[writable_frame]" --reporter console --success | tee writable-frame-integration.log
          if grep -qi "skipped" writable-frame-integration.log; then
            echo "::error::[writable_frame] integration tests were skipped on this macOS runner"
            exit 1
          fi

      - name: Writable-frame C API tests must run
        if: ${{ always() }}
        shell: bash
        run: |
          set -o pipefail
          ./build/tests/nozzle_c_api_tests "[writable_frame]" --reporter console --success | tee writable-frame-c-api.log
          if grep -qi "skipped" writable-frame-c-api.log; then
            echo "::error::[writable_frame] C API tests were skipped on this macOS runner"
            exit 1
          fi

      - name: C API fallback-policy regression must run
        if: ${{ always() }}
        shell: bash
        run: |
          set -o pipefail
          ./build/tests/nozzle_integration_tests "[fallback_policy]" --reporter console --success | tee fallback-policy.log
          if grep -qi "skipped" fallback-policy.log; then
            echo "::error::[fallback_policy] test was skipped on this macOS runner"
            exit 1
          fi

      - name: C API snapshot identity transition
        run: ./build/tests/nozzle_integration_tests "[info_snapshot][cross_process]" --reporter console --success

      - name: UTF-8 names and snapshot round trip
        run: |
          ./build/tests/nozzle_tests "[names]" --reporter compact
          ./build/tests/nozzle_c_api_tests "[names]" --reporter compact
          ./build/tests/nozzle_integration_tests "[name_roundtrip]" --reporter console --success

      # Explicit evidence for #56 RGB semantic -> storage fallback receiver metadata.
      - name: RGB semantic receiver metadata tests
        run: ./build/tests/nozzle_integration_tests "[integration][fallback][rgb_semantic]" --reporter console --success --allow-running-no-tests

      # Explicit evidence for #82 Metal IOSurface alias runtime coverage.
      # --allow-running-no-tests keeps runner capability skips visible in the log
      # without turning an unsupported macOS runner into a false test failure.
      - name: Metal IOSurface alias runtime tests
        run: ./build/tests/nozzle_integration_tests "[metal][direct_publish][native_format]" --reporter compact --success --allow-running-no-tests

  # ThreadSanitizer over all suites. Guards object-level thread safety (nozzle-dev#188).
  tsan-macos:
    runs-on: macos-15
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DNOZZLE_ENABLE_TEST_HOOKS=ON
          -DNOZZLE_BUILD_EXAMPLES=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          "-DCMAKE_OBJCXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread

      - name: Build
        run: cmake --build build-tsan -j 3

      - name: Unit tests (TSan)
        run: ./build-tsan/tests/nozzle_tests --reporter compact

      - name: C API tests (TSan)
        run: ./build-tsan/tests/nozzle_c_api_tests --reporter compact

      - name: Integration tests (TSan)
        run: ./build-tsan/tests/nozzle_integration_tests --reporter compact

      # The threading regression only has value when it actually runs, so surface a runner SKIP.
      - name: Receiver threading regression (TSan)
        shell: bash
        run: |
          set -o pipefail
          ./build-tsan/tests/nozzle_integration_tests "[threading]" --reporter console --success | tee threading.log
          if grep -qi "skipped" threading.log; then
            echo "::error::[threading] tests were skipped on this runner; TSan did not exercise receiver sharing"
            exit 1
          fi

  # SIMD parity lanes. The default runners never compile the x86 F16C path
  # (ubuntu-22.04 targets baseline x86-64) or the Linux NEON FP16 path (macOS
  # uses vImage first), so each lane forces one path. The
  # NOZZLE_TEST_EXPECT_* definitions turn a silent scalar fallback into a
  # compile error. With GCC, -mf16c also enables AVX for every translation
  # unit; the cpuinfo gate covers that, since every F16C CPU has AVX.
  # Each lane runs the whole unit suite, so the existing format_convert
  # cases also run on the forced path.
  simd-parity-x86-f16c:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Require F16C-capable runner CPU
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          if ! grep -qw f16c /proc/cpuinfo; then
            echo "::error::Runner CPU does not report F16C; refusing to run an F16C binary"
            exit 1
          fi

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Configure
        run: cmake -B build -DNOZZLE_BUILD_EXAMPLES=OFF "-DCMAKE_CXX_FLAGS=-mf16c -DNOZZLE_TEST_EXPECT_F16C=1"

      - name: Build unit tests
        run: cmake --build build --target nozzle_tests

      - name: Unit tests on the forced SIMD path
        run: ./build/tests/nozzle_tests --reporter compact

      - name: SIMD parity tests (compiled-path report)
        run: ./build/tests/nozzle_tests "[simd_parity]" --reporter console

  simd-parity-arm64-neon:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Configure
        run: cmake -B build -DNOZZLE_BUILD_EXAMPLES=OFF "-DCMAKE_CXX_FLAGS=-DNOZZLE_TEST_EXPECT_NEON_FP16=1"

      - name: Build unit tests
        run: cmake --build build --target nozzle_tests

      - name: Unit tests on the forced SIMD path
        run: ./build/tests/nozzle_tests --reporter compact

      - name: SIMD parity tests (compiled-path report)
        run: ./build/tests/nozzle_tests "[simd_parity]" --reporter console

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DNOZZLE_ENABLE_TEST_HOOKS=ON

      - name: Build
        id: build
        run: cmake --build build --config Debug

      - name: Shared layout unit regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: ./build/tests/Debug/nozzle_tests.exe "[shared_layout]" --reporter console --success

      - name: Shared layout receiver regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: ./build/tests/Debug/nozzle_integration_tests.exe "[shared_layout]" --reporter console --success

      - name: Initial metadata regression (actual D3D11 device)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          ./build/tests/Debug/nozzle_integration_tests.exe "[initial_metadata]" --reporter console --success | tee initial-metadata.log
          if grep -qi "skipped" initial-metadata.log; then
            echo "::error::[initial_metadata] must run on the actual D3D11 backend"
            exit 1
          fi

      - name: Sender lifecycle regression (actual D3D11 device)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          ./build/tests/Debug/nozzle_integration_tests.exe "[sender_lifecycle]" --reporter console --success | tee sender-lifecycle.log
          if grep -qi "skipped" sender-lifecycle.log; then
            echo "::error::[sender_lifecycle] must run on the actual D3D11 backend"
            exit 1
          fi

      - name: Windows IPC lifetime and abandoned mutex regression
        timeout-minutes: 2
        run: ./build/tests/Debug/nozzle_tests.exe "[windows_ipc]" --reporter console --success

      - name: Unit tests
        run: ./build/tests/Debug/nozzle_tests.exe --reporter compact

      - name: SIMD parity tests (compiled-path report)
        run: ./build/tests/Debug/nozzle_tests.exe "[simd_parity]" --reporter console

      - name: C API tests
        run: ./build/tests/Debug/nozzle_c_api_tests.exe --reporter compact

      # Integration tests must SKIP unsupported runner capabilities, not hide failures.
      - name: Integration tests
        run: ./build/tests/Debug/nozzle_integration_tests.exe --reporter compact

      - name: Receiver threading regression
        run: ./build/tests/Debug/nozzle_integration_tests.exe "[integration][threading]" --reporter console --success

      - name: C API snapshot identity transition
        run: ./build/tests/Debug/nozzle_integration_tests.exe "[info_snapshot][cross_process]" --reporter console --success

      - name: UTF-8 names and snapshot round trip
        shell: bash
        run: |
          ./build/tests/Debug/nozzle_tests.exe "[names]" --reporter compact
          ./build/tests/Debug/nozzle_c_api_tests.exe "[names]" --reporter compact
          ./build/tests/Debug/nozzle_integration_tests.exe "[name_roundtrip]" --reporter console --success

      # Explicit evidence for #56 RGB semantic -> storage fallback receiver metadata.
      - name: RGB semantic receiver metadata tests
        run: ./build/tests/Debug/nozzle_integration_tests.exe "[integration][fallback][rgb_semantic]" --reporter console --success --allow-running-no-tests

      # D3D11 native injection tests — gating, must pass
      - name: D3D11 native injection tests
        run: ./build/tests/Debug/nozzle_integration_tests.exe "[d3d11][native_device]" --reporter compact

  build-windows-strict:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DNOZZLE_STRICT_NO_EXCEPTIONS=ON -DNOZZLE_ENABLE_TEST_HOOKS=ON

      - name: Build
        run: cmake --build build --config Debug

      - name: Windows IPC lifetime and abandoned mutex regression
        timeout-minutes: 2
        run: ./build/tests/Debug/nozzle_tests.exe "[windows_ipc]" --reporter console --success

      - name: Unit tests
        run: ./build/tests/Debug/nozzle_tests.exe --reporter compact

  build-linux-strict:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Configure
        run: cmake -B build -DNOZZLE_STRICT_NO_EXCEPTIONS=ON -DNOZZLE_ENABLE_TEST_HOOKS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ./build/tests/nozzle_tests --reporter compact

      - name: DMA-BUF fd broker retry regression
        run: ./build/tests/nozzle_c_api_tests "[fd_broker]" --reporter console --success

      - name: C API tests
        run: ./build/tests/nozzle_c_api_tests --reporter compact

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Configure
        run: cmake -B build -DNOZZLE_ENABLE_TEST_HOOKS=ON

      - name: Build
        id: build
        run: cmake --build build

      - name: Shared layout unit regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: ./build/tests/nozzle_tests "[shared_layout]" --reporter console --success

      - name: Shared layout receiver regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: ./build/tests/nozzle_integration_tests "[shared_layout]" --reporter console --success

      - name: Unit tests
        run: ./build/tests/nozzle_tests --reporter compact

      - name: SIMD parity tests (compiled-path report)
        run: ./build/tests/nozzle_tests "[simd_parity]" --reporter console

      - name: DMA-BUF real cross-user peer policy
        run: sudo -n timeout 45s ./build/tests/nozzle_c_api_tests "[peer_policy_privileged]" --reporter console --success

      - name: DMA-BUF fd broker retry regression
        run: ./build/tests/nozzle_c_api_tests "[fd_broker]" --reporter console --success

      - name: C API tests
        run: ./build/tests/nozzle_c_api_tests --reporter compact

      # Integration tests must SKIP unsupported runner capabilities, not hide failures.
      - name: Integration tests
        run: ./build/tests/nozzle_integration_tests --reporter compact

  linux-dispatch-cross-tu:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Build fixed dispatch without linkage warnings
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-cross-tu -DNOZZLE_ENABLE_TEST_HOOKS=ON -DNOZZLE_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-cross-tu --target nozzle_c_api_tests -j 3 2>&1 | tee fixed-build.log
          if grep -F -- '-Wsubobject-linkage' fixed-build.log; then
            echo '::error::Dispatch still has anonymous-type linkage warnings'
            exit 1
          fi

      - name: Cross-TU regression without GPU requirements
        run: ./build-cross-tu/tests/nozzle_c_api_tests '[cross_tu]' --reporter console --success

      - name: Check out pinned JNI consumer
        if: matrix.build_type == 'Release'
        uses: actions/checkout@v4
        with:
          repository: nozzle-io/nozzle.java
          ref: 3142b611e796a11fe389a1e942d62ca2e1b4a377
          path: jni-consumer

      - name: Set up JNI headers
        if: matrix.build_type == 'Release'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify static core state is private in a real JNI shared object
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          make -C jni-consumer -j 3 NOZZLE_DIR="$GITHUB_WORKSPACE"
          library=jni-consumer/.build/libnozzle_jni.so
          nm -DC --defined-only "$library" > jni-dynamic-symbols.txt
          nm -C --defined-only "$library" > jni-all-symbols.txt
          grep -F 'Java_nozzle_' jni-dynamic-symbols.txt
          if grep -F 'nozzle::detail::backend::' jni-dynamic-symbols.txt; then
            echo '::error::Private Linux dispatch symbols escaped the consumer DSO'
            exit 1
          fi
          grep -F 'nozzle::detail::backend::g_sender_state' jni-all-symbols.txt
          grep -F 'nozzle::detail::backend::get_receiver_cache()::instance' jni-all-symbols.txt
          if grep -E ' u .*nozzle::detail::backend::' jni-all-symbols.txt; then
            echo '::error::Linux dispatch still has GNU unique symbols'
            exit 1
          fi
          echo 'NOZZLE_DISPATCH_DSO_PRIVATE JNI exports present; dispatch state local; no dispatch GNU unique symbols'

  build-linux-production-default:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ./build/tests/nozzle_tests --reporter compact

      - name: C API tests
        run: ./build/tests/nozzle_c_api_tests --reporter compact

  f16c-regression:
    runs-on: ubuntu-latest
    env:
      BROKEN_F16C_SHA: 2d3b7de5dd15983a5cb571bc43d337ff5fad238b
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout known-broken implementation for PR negative control
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/f16c-full-output'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BROKEN_F16C_SHA }}
          path: broken-f16c-source
          sparse-checkout: src/common/format_convert_f16c.cpp
          sparse-checkout-cone-mode: false

      - name: Require hosted x86 F16C capability
        run: |
          uname -a
          lscpu
          grep -m1 '^flags' /proc/cpuinfo
          if ! grep -qw f16c /proc/cpuinfo; then
            echo "::error::Hosted x86 runner does not expose F16C"
            exit 1
          fi

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Report current nozzle.go production-flags F16C macro state
        shell: bash
        run: |
          c++ --version
          production_flags=(
            -std=c++17
            -fno-exceptions
            -fno-rtti
            -O2
            -DNOZZLE_PLATFORM_LINUX=1
            -DNOZZLE_HAS_DMA_BUF=1
            -DNOZZLE_HAS_OPENGL=1
          )
          printf 'macro probe command: c++'
          printf ' %q' "${production_flags[@]}"
          printf ' -dM -E -x c++ /dev/null\n'
          if macro="$(c++ "${production_flags[@]}" -dM -E -x c++ /dev/null | grep '^#define __F16C__')"; then
            printf '%s\n' "$macro"
          else
            echo "__F16C__ is not predefined"
          fi

      - name: Configure known-broken regression
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/f16c-full-output'
        run: >-
          cmake -B build-f16c-broken
          -DNOZZLE_BUILD_F16C_TEST=ON
          -DNOZZLE_BUILD_EXAMPLES=OFF
          -DNOZZLE_F16C_TEST_SOURCE="${GITHUB_WORKSPACE}/broken-f16c-source/src/common/format_convert_f16c.cpp"

      - name: Build known-broken regression
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/f16c-full-output'
        run: cmake --build build-f16c-broken --target nozzle_f16c_tests --verbose

      - name: Prove known-broken implementation fails numerically
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/f16c-full-output'
        shell: bash
        run: |
          set +e
          output="$(./build-f16c-broken/tests/nozzle_f16c_tests 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::Known-broken ${BROKEN_F16C_SHA} returned status ${status}, expected numerical-test status 1"
            exit 1
          fi
          if [[ "$output" != *"8-element row: output[4]="* ]] || [[ "$output" != *"expected 5"* ]]; then
            echo "::error::Known-broken output did not contain the expected element-4 numerical failure"
            exit 1
          fi
          echo "Known-broken ${BROKEN_F16C_SHA} failed as expected (status=${status})"

      - name: Configure fixed regression and production flag capture
        run: >-
          cmake -B build-f16c-fixed
          -DNOZZLE_BUILD_F16C_TEST=ON
          -DNOZZLE_BUILD_EXAMPLES=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build production target with verbose compiler command
        run: cmake --build build-f16c-fixed --target nozzle --verbose

      - name: Report production F16C compiler state
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shlex
          import subprocess

          commands = json.loads(pathlib.Path("build-f16c-fixed/compile_commands.json").read_text())
          candidates = [
              item for item in commands
              if item["file"].endswith("format_convert_f16c.cpp")
              and "CMakeFiles/nozzle.dir/" in (item.get("output") or item.get("command", ""))
          ]
          if len(candidates) != 1:
              raise RuntimeError(f"expected one production F16C compile entry, found {len(candidates)}")
          entry = candidates[0]
          args = entry.get("arguments") or shlex.split(entry["command"])
          print("production compile command:", shlex.join(args))

          filtered = [args[0]]
          skip_next = False
          value_options = {"-o", "-MF", "-MT", "-MQ"}
          drop_options = {"-c", "-MD", "-MMD"}
          for arg in args[1:]:
              if skip_next:
                  skip_next = False
                  continue
              if arg in value_options:
                  skip_next = True
                  continue
              if arg in drop_options or arg == entry["file"]:
                  continue
              filtered.append(arg)
          probe = filtered + ["-dM", "-E", "-x", "c++", "/dev/null"]
          print("production macro probe:", shlex.join(probe))
          result = subprocess.run(
              probe,
              cwd=entry["directory"],
              check=True,
              capture_output=True,
              text=True,
          )
          macros = [line for line in result.stdout.splitlines() if line.startswith("#define __F16C__")]
          print(macros[0] if macros else "__F16C__ is not predefined")
          PY

      - name: Build and run fixed numerical regression
        run: |
          cmake --build build-f16c-fixed --target nozzle_f16c_tests --verbose
          ./build-f16c-fixed/tests/nozzle_f16c_tests

  # nozzle-dev#196. Runs on ubuntu-26.04 on purpose: a binary built there with
  # no ISA flags contained AVX2/FMA code. The job records the compiler's
  # default target, checks that NOZZLE_X86_64_BASELINE=v2 yields a checked
  # x86-64-v2 build, and reports (as a warning, not a gate) when the
  # image-default build no longer exceeds v2, since the override is then
  # no longer demonstrated.
  isa-baseline-x86-64-v2:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Record compiler default target
        run: |
          c++ --version
          c++ -Q --help=target -O2 | grep -E '^\s+-march=|^\s+-mtune='
          if ! c++ -O2 -dM -E -x c++ /dev/null | grep -E '__F16C__|__AVX__|__AVX2__|__FMA__'; then
            echo "no AVX-class macros predefined"
          fi

      - name: Checker self-test
        shell: bash
        run: |
          cat > isa_probe.c <<'PROBE_C'
          void scale_add(float *a, const float *b, int n) {
              for (int i = 0; i < n; ++i) a[i] = a[i] * 3.0f + b[i];
          }
          PROBE_C
          cc -O3 -march=x86-64-v3 -c isa_probe.c -o isa_probe_v3.o
          cc -O3 -march=x86-64-v2 -c isa_probe.c -o isa_probe_v2.o
          set +e
          bash scripts/check_x86_64_isa.sh isa_probe_v3.o
          v3_status=$?
          bash scripts/check_x86_64_isa.sh isa_probe_v2.o
          v2_status=$?
          set -e
          if [ "$v3_status" -ne 1 ]; then
            echo "::error::checker returned ${v3_status} for an x86-64-v3 object, expected 1"
            exit 1
          fi
          if [ "$v2_status" -ne 0 ]; then
            echo "::error::checker returned ${v2_status} for an x86-64-v2 object, expected 0"
            exit 1
          fi

      - name: Image-default library build (informational negative control)
        shell: bash
        run: |
          cmake -B build-default -DNOZZLE_BUILD_TESTS=OFF -DNOZZLE_BUILD_EXAMPLES=OFF
          cmake --build build-default --target nozzle
          set +e
          bash scripts/check_x86_64_isa.sh build-default/libnozzle.a
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "::notice::image-default build exceeds x86-64-v2, as expected on this image"
          elif [ "$status" -eq 0 ]; then
            echo "::warning::image-default build no longer exceeds x86-64-v2; this job no longer demonstrates the override"
          else
            echo "::error::checker failed with status ${status}"
            exit 1
          fi

      - name: Configure with explicit x86-64-v2 baseline
        run: cmake -B build -DNOZZLE_X86_64_BASELINE=v2 -DNOZZLE_BUILD_EXAMPLES=OFF

      - name: Build library and unit tests
        run: cmake --build build --target nozzle nozzle_tests

      - name: Verify x86-64-v2 ISA baseline
        run: bash scripts/check_x86_64_isa.sh build/libnozzle.a build/tests/nozzle_tests

      - name: Unit tests at the x86-64-v2 baseline
        run: ./build/tests/nozzle_tests --reporter compact

  package-sdk-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare SDK metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          platform="macos-universal-static"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="nozzle-sdk-${GITHUB_REF_NAME}-${platform}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            base="nozzle-sdk-latest-${short_sha}-${platform}"
          elif [[ "${GITHUB_REF}" == refs/heads/stable ]]; then
            base="nozzle-sdk-stable-${short_sha}-${platform}"
          else
            base="nozzle-sdk-ci-${short_sha}-${platform}"
          fi
          echo "package_root=${base}" >> "$GITHUB_OUTPUT"
          echo "package_name=${base}.zip" >> "$GITHUB_OUTPUT"

      - name: Configure SDK
        run: >-
          cmake -B build-sdk
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DNOZZLE_BUILD_TESTS=OFF
          -DNOZZLE_BUILD_EXAMPLES=OFF
          -DNOZZLE_BUILD_OPENGL=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_INSTALL_PREFIX="$PWD/dist/${{ steps.meta.outputs.package_root }}"

      - name: Build SDK
        run: cmake --build build-sdk --config Release

      - name: Install SDK
        run: cmake --install build-sdk --config Release

      - name: Verify macOS CMake export portability
        shell: bash
        run: |
          cmake_dir="dist/${{ steps.meta.outputs.package_root }}/lib/cmake/nozzle"
          if grep -R -E 'MacOSX\.sdk|/Library/Developer/CommandLineTools|/Applications/Xcode' "$cmake_dir"; then
            echo "installed CMake package contains build-machine SDK paths" >&2
            exit 1
          fi
          grep -R -F 'LINKER:-framework,Metal' "$cmake_dir"
          grep -R -F 'LINKER:-framework,IOSurface' "$cmake_dir"
          grep -R -F 'LINKER:-framework,Foundation' "$cmake_dir"
          grep -R -F 'LINKER:-framework,Accelerate' "$cmake_dir"
          grep -R -F 'LINKER:-framework,OpenGL' "$cmake_dir"

      - name: Add SDK docs
        run: |
          cp LICENSE "dist/${{ steps.meta.outputs.package_root }}/LICENSE"
          cp README-SDK.md "dist/${{ steps.meta.outputs.package_root }}/README-SDK.md"

      - name: Create archive
        run: |
          cd dist
          cmake -E tar cf "${{ steps.meta.outputs.package_name }}" --format=zip "${{ steps.meta.outputs.package_root }}"

      - name: Verify archive contents
        shell: bash
        run: |
          archive="dist/${{ steps.meta.outputs.package_name }}"
          cmake -E tar tf "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/include/nozzle/nozzle.hpp'
          cmake -E tar tf "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/include/nozzle/nozzle_c.h'
          cmake -E tar tf "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/lib/libnozzle.a'
          cmake -E tar tf "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/lib/cmake/nozzle/nozzleConfig.cmake'
          cmake -E tar tf "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/LICENSE'
          cmake -E tar tf "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/README-SDK.md'

      - name: Smoke test extracted SDK
        shell: bash
        run: |
          rm -rf smoke-extract smoke-build smoke-src
          mkdir -p smoke-extract smoke-src
          (cd smoke-extract && cmake -E tar xf "../dist/${{ steps.meta.outputs.package_name }}")
          lipo -info "smoke-extract/${{ steps.meta.outputs.package_root }}/lib/libnozzle.a"
          cat > smoke-src/main.c <<'SMOKE_C'
          #include <stdint.h>
          #include <nozzle/nozzle_c.h>
          int main(void) {
              NozzleSenderDesc desc = {0};
              uint32_t flags = 0;
              return nozzle_resolve_fallback_flags(&desc, &flags) == NOZZLE_OK ? 0 : 1;
          }
          SMOKE_C
          cat > smoke-src/CMakeLists.txt <<'SMOKE_CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(nozzle_sdk_smoke C CXX)
          find_package(nozzle CONFIG REQUIRED)
          add_executable(nozzle_sdk_smoke main.c)
          set_target_properties(nozzle_sdk_smoke PROPERTIES LINKER_LANGUAGE CXX)
          target_link_libraries(nozzle_sdk_smoke PRIVATE nozzle::nozzle)
          SMOKE_CMAKE
          cmake -S smoke-src -B smoke-build -DCMAKE_PREFIX_PATH="$PWD/smoke-extract/${{ steps.meta.outputs.package_root }}"
          cmake --build smoke-build
          ./smoke-build/nozzle_sdk_smoke

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_root }}
          path: dist/${{ steps.meta.outputs.package_name }}

